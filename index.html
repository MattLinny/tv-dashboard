<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serve at Oceanside</title>
<meta name="theme-color" content="#3C7BEA">
<script>
// ?tv → portrait lobby screen; ?rotate when the screen is on its side but the computer isn't rotated
const Q=new URLSearchParams(location.search), TV=Q.has('tv');
if(TV) document.documentElement.classList.add('tv');
if(TV&&Q.has('rotate')) document.documentElement.classList.add('rot');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Rethink+Sans:wght@400..800&display=swap">
<style>
/* Oceanside palette. Signal on the TV (blue field), cream page on phones; rust once, on the QR call to action.
   Display serif: Perfectly Nineties when it's installed on the machine, else Instrument Serif. */
:root{
  --blue:#3C7BEA; --ink-blue:#1A376B; --sky:#7FB2F0; --cream:#F3EFE6; --ink:#201F1F; --rust:#DB6246;
  --muted:rgba(26,55,107,.6); --track:rgba(127,178,240,.35);
  --serif:'Perfectly Nineties','Instrument Serif',Georgia,serif;
  --sans:'Rethink Sans','Early Sans',system-ui,-apple-system,sans-serif;
  --flip:.9s cubic-bezier(.3,1.25,.5,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--cream)}
body{margin:0;font-family:var(--sans);color:var(--ink-blue);background:var(--cream) url(tex/paper.webp) 0 0/400px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
h1,h2,p{margin:0}
h1{text-wrap:balance}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
.serif em{font-style:italic}

/* ───────── Spot cards: hung on a pin by a thin string. Position on the front, "I'm in!" and a name on the back ───────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:4px 9px}
.card{--hang:18px;position:relative;display:block;width:100%;height:124px;padding:0;border:0;background:none;text-align:left;perspective:1000px}
.pin{position:absolute;left:50%;top:0;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--ink-blue);box-shadow:inset -1.5px -1.5px 0 rgba(0,0,0,.25),1px 2px 2px rgba(10,30,70,.3);z-index:2}
.swing{position:absolute;inset:4px 0 0;transform-origin:50% 0;rotate:var(--tilt,0deg);animation:sway 7s ease-in-out var(--d,0s) infinite alternate}
@keyframes sway{from{rotate:calc(var(--tilt,0deg) - .8deg)}to{rotate:calc(var(--tilt,0deg) + .8deg)}}
.string{position:absolute;left:24%;top:0;width:52%;height:calc(var(--hang) - 2px);overflow:visible}
.string path{fill:none;stroke:rgba(26,55,107,.55);stroke-width:1.2}
.flip{position:absolute;left:0;right:0;top:calc(var(--hang) - 4px);bottom:0;transform-style:preserve-3d;transition:transform var(--flip)}
.card.on .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px 9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 0 rgba(26,55,107,.08),3px 8px 14px rgba(26,55,107,.16)}
.front{background:#fff;color:var(--ink-blue)}
.front .word{font-family:var(--serif);font-size:21px;line-height:.95;letter-spacing:-.02em}
.front .word.long{font-size:16px}
.meta{font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.back{background:var(--sky);transform:rotateY(180deg)}
.back b{font-weight:800;font-size:19px;line-height:.95;letter-spacing:-.01em;text-transform:uppercase;color:#fff}
.back .who{font-weight:700;font-size:12px;line-height:1.1;color:var(--ink-blue);overflow-wrap:anywhere}
button.card{cursor:pointer}
button.card .front{transition:scale .15s}
button.card:active .front{scale:.95}
.card.just .back{animation:glow 1.2s ease-out .8s 2}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(243,239,230,.9),3px 8px 14px rgba(26,55,107,.16)}100%{box-shadow:0 0 0 18px rgba(243,239,230,0),3px 8px 14px rgba(26,55,107,.16)}}

/* ───────── Phone page ───────── */
.hero{background:var(--blue) url(tex/tv-blue.webp) 50% 30%/cover;color:var(--cream);padding:calc(40px + env(safe-area-inset-top)) 20px 34px}
.hero h1{max-width:640px;margin:0 auto;font-size:clamp(56px,17vw,92px);line-height:.88}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(48px + env(safe-area-inset-bottom))}
.total{font-weight:500;font-size:17px}
.total b{font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--track);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ink-blue);transition:width .8s cubic-bezier(.3,.9,.3,1)}
.team{margin-top:30px}
.team-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.team h2{font-size:40px;line-height:1}
.left{flex:none;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.left.full{color:var(--ink-blue)}
.status{text-align:center;font-weight:500;font-size:15px;color:var(--muted);padding:30px 0}

/* "Sign me up" sheet, after the printed sign-up card */
dialog{border:0;padding:0;background:none;max-width:none;max-height:none;width:100%;margin:auto auto 0;color:var(--ink-blue)}
dialog::backdrop{background:rgba(26,55,107,.5)}
.sheet{background:var(--cream) url(tex/paper.webp) 0 0/400px;border-radius:26px 26px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
dialog[open] .sheet{animation:up .36s cubic-bezier(.2,1.1,.35,1)}
dialog.out .sheet{animation:down .18s ease-in forwards}
@keyframes up{from{translate:0 40px;opacity:0}}
@keyframes down{to{translate:0 30px;opacity:0}}
@media (min-width:640px){ dialog{margin:auto} .sheet{border-radius:26px} }
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.sheet-head h2{font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.spot{margin-top:8px;font-weight:600;font-size:16px;color:var(--blue)}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(26,55,107,.08);font-size:22px;line-height:1;cursor:pointer}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}
.field em{font-style:normal;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.field input,.field textarea{width:100%;border:1.5px solid transparent;border-radius:12px;background:#fff;padding:13px 14px;font-weight:500;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
.field textarea{resize:none;height:72px}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.hp{position:absolute;left:-9999px}
.go{width:100%;border:0;border-radius:99px;padding:17px;background:var(--ink-blue);color:var(--cream);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px;cursor:pointer;transition:scale .15s,opacity .2s}
.go:active{scale:.98}
.go[disabled]{opacity:.6}
.err{color:#A8432C;font-weight:600;font-size:14px;margin-top:10px}
.err:empty{display:none}
.imin{background:var(--sky);border-radius:18px;aspect-ratio:1.6;display:grid;place-items:center;margin-bottom:20px;animation:card .6s cubic-bezier(.3,1.4,.5,1)}
.imin b{font-weight:800;font-size:clamp(46px,15vw,72px);letter-spacing:-.01em;color:#fff;text-transform:uppercase}
@keyframes card{from{scale:.85;rotate:-3deg;opacity:0}}
.done h2{font-size:38px;line-height:1}
.done p{font-weight:500;font-size:16px;line-height:1.45;margin:10px 0 18px}

/* ───────── TV display ───────── */
.tvw{display:none}
html.tv,html.tv body{height:100%;overflow:hidden;cursor:none;background:var(--blue) url(tex/tv-blue.webp) center/cover no-repeat}
html.tv .phone,html.tv dialog{display:none}
html.tv .tvw{display:flex;flex-direction:column;width:1080px;padding:54px 52px 48px;transform-origin:0 0;color:var(--cream)}
.tv-head{display:flex;gap:36px;align-items:stretch}
.tv-title{flex:1;display:flex;flex-direction:column}
.tv-title h1{font-size:112px;line-height:.86;margin-top:-4px}
.tv-total{margin-top:auto;padding-top:26px;font-weight:600;font-size:34px}
.tv-total b{font-weight:800}
.tv-total .bar{height:14px;margin:14px 0 0;background:rgba(243,239,230,.28)}
.tv-total .bar i{background:var(--cream)}
.qr{flex:none;width:262px;background:var(--cream);border-radius:28px;padding:20px 20px 22px;display:flex;flex-direction:column;align-items:center;color:var(--ink-blue)}
.qr-code svg{display:block;width:222px;height:222px}
.qr-cta{margin-top:16px;background:var(--rust);color:var(--ink);font-weight:800;font-size:26px;padding:12px 24px;border-radius:99px;white-space:nowrap}

.tv-teams{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;padding-top:30px}
.tv-team-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.tv-team-head h2{font-size:54px;line-height:.9}
.need{font-weight:800;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.need b{font-size:34px;letter-spacing:0;margin-right:6px}
.tvw .cards{grid-template-columns:repeat(7,1fr);gap:0 14px}
.tvw .card{--hang:26px;height:164px}
.tvw .pin{width:12px;height:12px;margin-left:-6px;background:var(--cream)}
.tvw .string path{stroke:rgba(243,239,230,.75);stroke-width:1.6}
.tvw .face{border-radius:9px;padding:14px 13px 12px;box-shadow:4px 12px 18px rgba(10,30,70,.32)}
.tvw .front{background:var(--cream) url(tex/paper.webp) 0 0/400px}
.tvw .front .word{font-size:31px}
.tvw .front .word.long{font-size:23px}
.tvw .meta{font-size:12px}
.tvw .back b{font-size:29px}
.tvw .back .who{font-size:19px}
html.tv.rot body{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="phone">
  <header class="hero"><h1 class="serif">Find your <em>place</em> on a team.</h1></header>
  <div class="wrap">
    <p class="total" id="total">&nbsp;</p>
    <div class="bar"><i id="totalBar" style="width:0"></i></div>
    <main id="list"><p class="status">Loading the teams…</p></main>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet"></div>
</dialog>

<div class="tvw" id="tv" aria-hidden="true">
  <div class="tv-head">
    <div class="tv-title">
      <h1 class="serif">Find your <em>place</em> on a team.</h1>
      <div class="tv-total"><p id="tvTotal"></p><div class="bar"><i id="tvBar" style="width:0"></i></div></div>
    </div>
    <div class="qr"><div class="qr-code" id="qr"></div><div class="qr-cta">Scan to join</div></div>
  </div>
  <div class="tv-teams" id="tvTeams"></div>
</div>

<script>
const CONFIG = {
  // Google Apps Script web app (apps-script/Code.gs). Leave '' to show sample teams; sign-ups then only stay in this browser.
  apiUrl: '',
  // Where the TV's QR code sends people
  joinLink: 'https://mattlinny.github.io/tv-dashboard/',
  refreshSeconds: 60,     // phone page
  tvRefreshSeconds: 15,   // TV
};

/* Sample data, shaped like the web app's answer: { teams:[{ team, positions:[{ position, needed, filled:[names] }] }] }
   One card per spot, so positions read best as one word: Camera ×2 shows as [Camera] [Camera]. */
const SAMPLE = {teams:[
  {team:'Logistics', positions:[{position:'Parking',needed:3,filled:['Tom R.','Dave T.']},{position:'Coffee',needed:2,filled:['Amy C.']},{position:'Setup',needed:2,filled:[]}]},
  {team:'Worship', positions:[{position:'Vocals',needed:2,filled:['Grace M.','Hannah L.']},{position:'Acoustic',needed:1,filled:['Ben F.']},{position:'Electric',needed:1,filled:[]},{position:'Drums',needed:1,filled:[]},{position:'Bass',needed:1,filled:['Josh M.']},{position:'Keys',needed:1,filled:[]}]},
  {team:'Production', positions:[{position:'Camera',needed:2,filled:['Noah S.']},{position:'Sound',needed:2,filled:['Chris D.','Sam W.']},{position:'Visuals',needed:2,filled:[]},{position:'Setup',needed:1,filled:[]}]},
  {team:'Chairs', positions:[{position:'Setup',needed:4,filled:['Luke B.','Mike D.','Jacob P.']},{position:'Teardown',needed:3,filled:['Kate S.']}]},
  {team:'ONE80 Kids', positions:[{position:'Nursery',needed:2,filled:['Priya N.']},{position:'Preschool',needed:2,filled:[]},{position:'Elementary',needed:2,filled:['Rachel K.','Emma W.']},{position:'Check-in',needed:1,filled:['Olivia B.']}]},
  {team:'Welcome', positions:[{position:'Greeter',needed:3,filled:['Sarah K.','Jen O.']},{position:'Info',needed:2,filled:[]},{position:'Usher',needed:2,filled:['Mike D.']}]},
]};

/* ───────── Data ───────── */
let TEAMS=[], failed=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=n=>{const w=String(n).trim().split(/\s+/);return w.length>1?`${w[0]} ${w.at(-1)[0].toUpperCase()}.`:w[0];};
const count=t=>t.positions.reduce((a,p)=>(a.needed+=p.needed,a.filled+=Math.min(p.filled.length,p.needed),a),{needed:0,filled:0});

async function loadTeams(){
  if(!CONFIG.apiUrl) return structuredClone(SAMPLE.teams);
  const r=await fetch(CONFIG.apiUrl,{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return (await r.json()).teams||[];
}

/* ───────── Cards ───────── */
const SEEN=new Set(), JUST=new Set();   // every "team|position|name" seen so far, and the ones that just arrived
const slotKey=(t,p,n)=>`${t.team}|${p.position}|${n}`;

// One card per spot, hung on its own pin with a slight tilt. A spot that just filled is drawn face up, then turns over.
function hashTilt(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ((h>>>0)%1000)/1000; }
function cards(t,ti){
  return `<div class="cards">${t.positions.flatMap((p,pi)=>Array.from({length:p.needed},(_,i)=>{
    const n=p.filled[i], just=n&&JUST.has(slotKey(t,p,n)), r=hashTilt(`${t.team}|${p.position}|${i}`);
    const style=`--tilt:${(r*3.4-1.7).toFixed(2)}deg;--d:${(-r*7).toFixed(2)}s`;
    const inner=`<span class="pin"></span><span class="swing"><svg class="string" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0L8 20M50 0L92 20" vector-effect="non-scaling-stroke"/></svg>
      <span class="flip"><span class="face front"><span class="word${p.position.length>8?' long':''}">${esc(p.position)}</span><span class="meta">Open</span></span>
      <span class="face back"><b>I’m<br>in!</b><span class="who">${esc(n||'')}</span></span></span></span>`;
    if(n) return `<div class="card${just?' just':' on'}" style="${style}" role="img" aria-label="${esc(p.position)}: ${esc(n)}">${inner}</div>`;
    return TV?`<div class="card" style="${style}">${inner}</div>`
      :`<button class="card" type="button" style="${style}" data-t="${ti}" data-p="${pi}" aria-label="Join ${esc(t.team)} as ${esc(p.position)}">${inner}</button>`;
  })).join('')}</div>`;
}
function flipJust(root){
  if(!JUST.size) return;
  JUST.clear();
  void root.offsetWidth;   // lay out face up first so the turn animates
  root.querySelectorAll('.card.just').forEach((el,i)=>setTimeout(()=>el.classList.add('on'),400+i*250));
  setTimeout(()=>root.querySelectorAll('.card.just').forEach(el=>el.classList.remove('just')),6000);
}

/* ───────── Phone page ───────── */
function renderTotals(){
  const all=TEAMS.reduce((a,t)=>{const c=count(t);a.needed+=c.needed;a.filled+=c.filled;return a},{needed:0,filled:0});
  const open=all.needed-all.filled, pct=all.needed?all.filled/all.needed*100:0;
  document.getElementById('total').innerHTML=all.needed?(open?`<b>${open} ${open===1?'spot':'spots'} open</b> across ${TEAMS.length} teams`:'<b>Every spot is filled.</b> Thank you.'):'&nbsp;';
  document.getElementById('totalBar').style.width=pct+'%';
  document.getElementById('tvTotal').innerHTML=`<b>${all.filled} of ${all.needed}</b> spots filled`;
  document.getElementById('tvBar').style.width=pct+'%';
}

function renderPhone(){
  const list=document.getElementById('list');
  if(failed&&!TEAMS.length){ list.innerHTML='<p class="status">Couldn’t load the teams. Check your connection and try again.</p>'; return; }
  list.innerHTML=TEAMS.map((t,ti)=>{
    const c=count(t), open=c.needed-c.filled;
    return `<section class="team">
      <div class="team-head"><h2 class="serif">${esc(t.team)}</h2><span class="left${open?'':' full'}">${open?`${open} open`:'Full'}</span></div>
      ${cards(t,ti)}
    </section>`;
  }).join('');
  flipJust(list);
}

document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('button.card'); if(!b) return;
  const t=TEAMS[b.dataset.t]; openForm(t,t.positions[b.dataset.p]);
});

/* ───────── Sign-up form ───────── */
const dlg=document.getElementById('dlg'), sheet=document.getElementById('sheet');
const touch=matchMedia('(pointer:coarse)').matches;
function openForm(t,p){
  sheet.innerHTML=`<div class="sheet-head">
      <div><h2 id="dlgTitle">Sign me up</h2><p class="spot">${esc(t.team)} · ${esc(p.position)}</p></div>
      <button class="x" type="button" aria-label="Close">&times;</button>
    </div>
    <form novalidate>
      <label class="field"><span>Name</span><input name="name" autocomplete="name" required maxlength="80"></label>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required maxlength="120"></label>
      <label class="field"><span>Phone <em>· optional</em></span><input name="phone" type="tel" autocomplete="tel" maxlength="40"></label>
      <label class="field"><span>Notes <em>· optional</em></span><textarea name="notes" maxlength="400"></textarea></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="go" type="submit">I’m in</button>
      <p class="err" role="alert"></p>
    </form>`;
  sheet.querySelector('.x').onclick=closeForm;
  const form=sheet.querySelector('form'), err=sheet.querySelector('.err'), go=sheet.querySelector('.go');
  form.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form));
    for(const k in d) d[k]=d[k].trim();
    if(!d.name){ err.textContent='Add your name.'; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){ err.textContent='Add an email we can reach you at.'; return; }
    err.textContent=''; go.disabled=true; go.textContent='Signing you up…';
    try{
      const res=await signup({action:'signup',team:t.team,position:p.position,...d});
      if(res.ok){ done(d,t,p,res); refresh(false); return; }
      err.textContent={full:'That spot just filled. Pick another one?',already:'You’re already signed up for this one.',missing:'Add your name and email.'}[res.error]||'Something went wrong. Please try again.';
      if(res.error==='full') refresh(false);
    }catch{ err.textContent='Couldn’t send that. Check your connection and try again.'; }
    go.disabled=false; go.textContent='I’m in';
  };
  dlg.showModal();
  if(!touch) form.elements.name.focus({preventScroll:true});
}
function done(d,t,p,res){
  const first=d.name.split(/\s+/)[0];
  sheet.innerHTML=`<div class="done">
    <div class="imin" aria-hidden="true"><b>I’m in!</b></div>
    <h2 class="serif" id="dlgTitle">Welcome to ${esc(t.team)}, ${esc(first)}.</h2>
    <p>${res.receipt===false?'':`We’ve emailed the details to ${esc(d.email)}. `}Someone from the team will be in touch this week.</p>
    <button class="go" type="button">Done</button>
  </div>`;
  sheet.querySelector('.go').onclick=closeForm;
}
function closeForm(){
  if(!dlg.open) return;
  dlg.classList.add('out');
  setTimeout(()=>{ dlg.classList.remove('out'); dlg.close(); },170);
}
dlg.addEventListener('cancel',e=>{ e.preventDefault(); closeForm(); });
dlg.addEventListener('click',e=>{ if(e.target===dlg) closeForm(); });

async function signup(body){
  if(!CONFIG.apiUrl){   // sample mode: the sign-up only lives in this browser
    const p=SAMPLE.teams.find(t=>t.team===body.team).positions.find(x=>x.position===body.position);
    if(p.filled.length>=p.needed) return {ok:false,error:'full'};
    p.filled.push(short(body.name)); return {ok:true,receipt:false};
  }
  const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}

/* ───────── TV ───────── */
function renderTV(){
  const root=document.getElementById('tvTeams');
  root.innerHTML=TEAMS.map(t=>{
    const c=count(t), open=c.needed-c.filled;
    return `<section>
      <div class="tv-team-head"><h2 class="serif">${esc(t.team)}</h2><div class="need">${open?`<b>${open}</b>open`:'Full'}</div></div>
      ${cards(t)}
    </section>`;
  }).join('');
  fitTV();
  flipJust(root);
}

// Lay out at 1080 wide and fill the screen's height; scale down only if the content runs taller.
function fitTV(){
  const tv=document.getElementById('tv'), rot=document.documentElement.classList.contains('rot');
  const W=rot?innerHeight:innerWidth, H=rot?innerWidth:innerHeight, k0=W/1080;
  tv.style.scale=''; tv.style.minHeight=(H/k0)+'px';
  const k=Math.min(k0,H/tv.offsetHeight);
  tv.style.scale=k.toFixed(4);
  tv.style.marginLeft=((W-1080*k)/2)+'px';
}

/* ───────── Refresh ───────── */
let LAST='';
const CACHE_KEY='serve:teams';
function render(){ renderTotals(); TV?renderTV():renderPhone(); }
async function refresh(first){
  try{ TEAMS=await loadTeams(); failed=false; }
  catch{ failed=true; if(TEAMS.length) return; }
  const data=JSON.stringify(TEAMS);
  if(!first&&data===LAST) return;
  for(const t of TEAMS) for(const p of t.positions) for(const n of p.filled){
    const k=slotKey(t,p,n); if(LAST&&!SEEN.has(k)) JUST.add(k); SEEN.add(k);
  }
  LAST=data; render();
  if(!failed&&CONFIG.apiUrl) try{ localStorage.setItem(CACHE_KEY,data); }catch{}
}
// The sheet's server takes 1–2 s to answer: draw the last answer this browser saw straight away, then swap in the fresh one.
try{ const c=CONFIG.apiUrl&&JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if(Array.isArray(c)&&c.length){ TEAMS=c; LAST=JSON.stringify(c); c.forEach(t=>t.positions.forEach(p=>p.filled.forEach(n=>SEEN.add(slotKey(t,p,n))))); render(); } }catch{}
refresh(!LAST);
setInterval(()=>refresh(false),(TV?CONFIG.tvRefreshSeconds:CONFIG.refreshSeconds)*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!TV) refresh(false); });

if(TV){
  addEventListener('resize',fitTV);
  document.fonts&&document.fonts.ready.then(fitTV);
  const sc=document.createElement('script'); sc.src='vendor/qrcode.js';
  sc.onload=()=>{
    const qr=qrcode(0,'M'); qr.addData(CONFIG.joinLink); qr.make();
    const n=qr.getModuleCount(); let d='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
    document.getElementById('qr').innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="${d}" fill="#1A376B"/></svg>`;
  };
  document.head.append(sc);
  // keep the screen on, and reload every few hours to pick up any changes to the page
  const awake=()=>{ try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch{} };
  awake(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) awake(); });
  setTimeout(()=>location.reload(),6*3600*1000);
}
</script>
