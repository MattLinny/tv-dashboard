<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serve with us · Oceanside</title>
<meta name="theme-color" content="#3C7BEA">
<script>
// ?tv → portrait lobby screen; ?rotate when the screen is on its side but the computer isn't rotated
const Q=new URLSearchParams(location.search), TV=Q.has('tv');
if(TV) document.documentElement.classList.add('tv');
if(TV&&Q.has('rotate')) document.documentElement.classList.add('rot');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Instrument+Serif:ital@0;1&family=Rethink+Sans:wght@400..800&display=swap">
<style>
/* A blue cloth wall with paper tags hung on pegs. Blank tag = an open spot; a filled tag turns over to
   "I'm in!" with the name written in by hand. Each team also hangs one sketch card, and on the TV blank tags
   now and then turn over to show a sketch of the job.
   Oceanside palette; green for the tape and the pins.
   Display serif: Perfectly Nineties when it's installed on the machine, else Instrument Serif. */
:root{
  --blue:#3C7BEA; --ink-blue:#1A376B; --green:#34514A; --sky:#7FB2F0; --cream:#F3EFE6; --ink:#201F1F;
  --serif:'Perfectly Nineties','Instrument Serif',Georgia,serif;
  --sans:'Rethink Sans','Early Sans',system-ui,-apple-system,sans-serif;
  --hand:'Caveat','Bradley Hand',cursive;
  --wall:var(--blue);
  --paper:var(--cream) url(tex/paper.webp) 0 0/400px;
  --turn:1s cubic-bezier(.3,1.2,.45,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--blue)}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--cream);background:var(--wall);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
h1,h2,p{margin:0}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.serif em{font-style:italic}

/* ───────── Heading: one plain serif line, sentence case ───────── */
.title{font-size:var(--t,48px);line-height:1;color:var(--cream);text-wrap:balance}

/* ───────── Tags hung on pegs. Sizes inside a tag are in cqw, so one tag design works at every size ───────── */
.tags{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 12px}
.tag{--hang:22px;--hole:13cqw;--cut:17cqw;position:relative;display:block;width:100%;aspect-ratio:.64;padding:0;border:0;background:none;text-align:left;container-type:inline-size;perspective:900px}
.peg{position:absolute;left:50%;top:0;width:10px;height:10px;margin:-1px 0 0 -5px;border-radius:50%;background:var(--cream);box-shadow:inset -2px -2px 0 rgba(26,55,107,.25),1px 3px 3px rgba(10,30,70,.35);z-index:3}
.swing{position:absolute;inset:3px 0 0;transform-origin:50% 0;rotate:var(--tilt,0deg);animation:sway 8s ease-in-out var(--d,0s) infinite alternate}
@keyframes sway{from{rotate:calc(var(--tilt,0deg) - .9deg)}to{rotate:calc(var(--tilt,0deg) + .9deg)}}
.string{position:absolute;left:50%;top:0;width:16px;margin-left:-8px;height:calc(var(--hang) + var(--hole));z-index:2;overflow:visible}
.string path{fill:none;stroke:rgba(243,239,230,.85);stroke-width:1.4}
.shape{clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%,0 var(--cut))}
.holed{-webkit-mask:radial-gradient(circle at 50% var(--hole),transparent 4.4cqw,#000 calc(4.4cqw + .6px));mask:radial-gradient(circle at 50% var(--hole),transparent 4.4cqw,#000 calc(4.4cqw + .6px))}
.holed::before{content:"";position:absolute;left:50%;top:var(--hole);width:15cqw;height:15cqw;translate:-50% -50%;border-radius:50%;box-shadow:inset 0 0 0 2.4cqw rgba(26,55,107,.14)}
.shade{position:absolute;left:0;right:0;top:var(--hang);bottom:0;filter:blur(5px);translate:4px 9px;opacity:.5}
.shade i{position:absolute;inset:0;background:#0A1E46}
.flip{position:absolute;left:0;right:0;top:var(--hang);bottom:0;transform-style:preserve-3d;transition:transform var(--turn)}
.tag.on .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--hole) + 11cqw) 9cqw 8cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--paper);color:var(--ink-blue)}
.back{background:var(--sky) url(tex/sky.webp) var(--bx,0) var(--by,0)/360px 480px;color:var(--ink-blue);transform:rotateY(180deg)}
.word{font-family:var(--serif);font-size:25cqw;line-height:.95;letter-spacing:-.02em}
.word.long{font-size:19.5cqw}
.line{position:relative;display:block;border-bottom:1px solid rgba(26,55,107,.45);min-height:31cqw}
.line small{position:absolute;left:0;bottom:2cqw;font-weight:700;font-size:8cqw;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.back b{font-weight:800;font-size:23cqw;line-height:.92;text-transform:uppercase;color:#fff}
.hand{position:absolute;left:0;right:0;bottom:-2.5cqw;font-family:var(--hand);font-weight:600;font-size:25cqw;line-height:1;color:var(--ink-blue);rotate:-3deg;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1cqw}
.hand.long{font-size:20cqw}
button.tag{cursor:pointer}
button.tag .front{transition:filter .15s}
button.tag:active .front{filter:brightness(.94)}
.tag.just .swing{animation:sway 8s ease-in-out var(--d,0s) infinite alternate,nudge 1.4s cubic-bezier(.3,1.6,.5,1) .2s}
@keyframes nudge{30%{translate:0 10px}}

/* Sketch cards: a drawing that goes with the team, hung among its tags. Card colour and line colour vary;
   the drawing is a mask, so its lines take any brand colour. */
.solo{position:absolute;left:0;right:0;top:var(--hang);bottom:0;display:block;padding:calc(var(--hole) + 8cqw) 8cqw 9cqw}
.loose .solo{top:calc(var(--hang) - 6px);padding:9cqw}
.loose .shade{top:calc(var(--hang) - 6px)}
.loose .swing{rotate:calc(var(--tilt,0deg) * 2)}
.art{display:block;width:100%;height:100%;background:var(--line);-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat}
.pic{padding:calc(var(--hole) + 9cqw) 12cqw 12cqw}
/* Colour pairs for picture sides and sketch cards: a card colour and a line colour, printed on paper.
   Pale tints stay clear of Sky, which only means "I'm in". */
.pic,.deco .solo{background:url(tex/paper.webp) 0 0/400px,var(--bg);background-blend-mode:multiply}
.c-mist{--bg:#A3C3D9;--line:var(--green)}
.c-white{--bg:#FBFAF6;--line:#3E7CC0}
.c-cream{--bg:#F8F3E3;--line:#79A7DB}
.c-sand{--bg:#E8DFBF;--line:var(--green)}
.c-green{--bg:#3B5249;--line:var(--cream)}
.c-blue{--bg:#4A82B8;--line:#F7F4EC}
.tag.peek .flip{transform:rotateY(180deg)}
.pushpin{position:absolute;left:50%;top:calc(var(--hang) + 1px);width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--green);box-shadow:inset -2px -3px 0 rgba(0,0,0,.2),2px 4px 4px rgba(10,30,70,.4);z-index:3}
.tape{position:absolute;left:50%;top:calc(var(--hang) - 14px);width:56cqw;height:16px;margin-left:-28cqw;background:rgba(52,81,74,.88);rotate:-5deg;z-index:3;
  clip-path:polygon(0 10%,5% 0,95% 0,100% 15%,96% 35%,100% 55%,96% 75%,100% 100%,4% 100%,0 80%,4% 60%,0 40%,4% 22%)}

/* ───────── Phone page ───────── */
.phone{max-width:640px;margin:0 auto;padding:calc(44px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom))}
.phone .title{--t:clamp(40px,11.5vw,56px);margin-bottom:8px}
.team{margin-top:40px}
.team h2{font-size:42px;line-height:1;margin-bottom:6px}
.status{font-weight:600;font-size:16px;padding:40px 0}

/* "Sign me up", after the printed sign-up card: square paper, caps labels, white boxes */
dialog{border:0;padding:0;background:none;max-width:none;max-height:none;width:100%;margin:auto auto 0;color:var(--ink-blue);overflow:visible}
dialog::backdrop{background:rgba(10,30,70,.55)}
.sheet{background:var(--paper);padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:6px 6px 0 0;box-shadow:0 -6px 30px rgba(10,30,70,.3)}
dialog[open] .sheet{animation:up .38s cubic-bezier(.2,1.1,.35,1)}
dialog.out .sheet{animation:down .18s ease-in forwards}
@keyframes up{from{translate:0 40px;opacity:0}}
@keyframes down{to{translate:0 30px;opacity:0}}
@media (min-width:640px){ dialog{margin:auto} .sheet{border-radius:6px} }
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.sheet-head h2{font-weight:800;font-size:32px;line-height:1;text-transform:uppercase}
.spot{margin-top:6px;font-size:26px;color:var(--blue)}
.x{flex:none;width:36px;height:36px;border:0;border-radius:4px;background:rgba(26,55,107,.08);font-size:22px;line-height:1;cursor:pointer}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.field em{font-style:normal;font-weight:600;letter-spacing:.08em;opacity:.55}
.field input,.field textarea{width:100%;border:1.5px solid transparent;border-radius:2px;background:#fff;padding:13px 12px;font-weight:500;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
.field textarea{resize:none;height:68px}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.hp{position:absolute;left:-9999px}
.go{width:100%;border:0;border-radius:3px;padding:17px;background:var(--ink-blue);color:var(--cream);font-weight:800;font-size:17px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;cursor:pointer;transition:scale .15s,opacity .2s}
.go:active{scale:.98}
.go[disabled]{opacity:.6}
.err{color:#A8432C;font-weight:600;font-size:14px;margin-top:10px}
.err:empty{display:none}
.done{text-align:center}
.done .stage{display:flex;justify-content:center;background:var(--wall);margin:-26px -22px 22px;padding:26px 0 30px;border-radius:6px 6px 0 0}
.done .tag{--hang:30px;width:150px;aspect-ratio:.68}
.done h2{font-size:38px;line-height:1}
.done p{font-weight:500;font-size:16px;line-height:1.45;margin:10px 0 18px}

/* ───────── TV display ───────── */
.tvw{display:none}
html.tv,html.tv body{height:100%;overflow:hidden;cursor:none}
html.tv .phone,html.tv dialog{display:none}
html.tv .tvw{display:flex;flex-direction:column;width:1080px;padding:50px 52px 40px;transform-origin:0 0}
.tv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.tvw .title{--t:104px;margin-top:20px;max-width:700px}
.qr{position:relative;flex:none;width:250px;margin:18px 6px 0 0;background:var(--paper);padding:20px 18px 16px;rotate:2deg;box-shadow:3px 8px 18px rgba(10,30,70,.35);color:var(--ink-blue);text-align:center}
.qr .tape{--hang:0px;width:130px;margin-left:-65px;height:30px;top:-15px}
.qr-code svg{display:block;width:214px;height:214px}
.qr-cta{margin-top:12px;font-weight:800;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.tv-teams{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;margin-top:20px}
.tvw .team{margin:0}
.tvw .team h2{font-size:52px;margin-bottom:2px}
.tvw .tags{grid-template-columns:repeat(var(--cols,7),1fr);gap:0 18px}
.tvw .tag{--hang:28px;aspect-ratio:.72}
.tvw .peg{width:13px;height:13px;margin:-1px 0 0 -6.5px}
.tvw .string path{stroke-width:1.8}
html.tv.rot body{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<main class="phone">
  <h1 class="title serif">Church feels different when you’re part of it.</h1>
  <div id="list"><p class="status">Loading the teams…</p></div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet"></div>
</dialog>

<div class="tvw" id="tv" aria-hidden="true">
  <div class="tv-head">
    <div>
      <h1 class="title serif">Church feels different when you’re part of it.</h1>
    </div>
    <div class="qr"><span class="tape"></span><div class="qr-code" id="qr"></div><div class="qr-cta">Scan to join</div></div>
  </div>
  <div class="tv-teams" id="tvTeams"></div>
</div>

<script>
const CONFIG = {
  // Google Apps Script web app (apps-script/Code.gs). Leave '' to show sample teams; sign-ups then only stay in this browser.
  apiUrl: 'https://script.google.com/macros/s/AKfycbyhcLIXhrb8p4MewTNTbzyLqFXpHpdm-sPNAKhqiXwxc8ALM8e4P3cOQ8sOYs9LeZmv/exec',
  // Where the TV's QR code sends people
  joinLink: 'https://mattlinny.github.io/tv-dashboard/',
  refreshSeconds: 60,     // phone page
  tvRefreshSeconds: 15,   // TV
  // TV only: every so often a blank tag turns over to show a sketch, then turns back. Seconds between turns
  // (picked at random in this range), and how long the picture stays up.
  peekEvery: [5, 12],
  peekHold: 20,
  peekMax: 3,
};

/* Sample data, shaped like the web app's answer: { teams:[{ team, positions:[{ position, needed, filled:[names] }] }] }
   needed = how many blank tags to hang at first. There's no cap: every position always keeps one blank tag. */
const SAMPLE = {teams:[
  {team:'Logistics', positions:[{position:'Parking',needed:3,filled:['Tom R.','Dave T.']},{position:'Coffee',needed:2,filled:['Amy C.']},{position:'Setup',needed:1,filled:[]}]},
  {team:'Worship', positions:[{position:'Vocals',needed:2,filled:['Grace M.']},{position:'Acoustic',needed:1,filled:[]},{position:'Electric',needed:1,filled:[]},{position:'Drums',needed:1,filled:[]},{position:'Bass',needed:1,filled:[]},{position:'Keys',needed:1,filled:[]}]},
  {team:'Production', positions:[{position:'Camera',needed:2,filled:['Noah S.']},{position:'Sound',needed:2,filled:['Chris D.']},{position:'Visuals',needed:1,filled:[]},{position:'Setup',needed:1,filled:[]}]},
  {team:'Chairs', positions:[{position:'Setup',needed:3,filled:['Luke B.','Mike D.']},{position:'Teardown',needed:3,filled:['Kate S.']}]},
  {team:'ONE80 Kids', positions:[{position:'Nursery',needed:2,filled:['Priya N.']},{position:'Preschool',needed:2,filled:[]},{position:'Elementary',needed:2,filled:['Rachel K.']},{position:'Check-in',needed:1,filled:[]}]},
  {team:'Welcome', positions:[{position:'Greeter',needed:2,filled:['Sarah K.','Jen O.']},{position:'Info',needed:1,filled:[]},{position:'Usher',needed:2,filled:['Mike D.']}]},
]};

/* ───────── Data ───────── */
let TEAMS=[], failed=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=n=>{const w=String(n).trim().split(/\s+/);return w.length>1?`${w[0]} ${w.at(-1)[0].toUpperCase()}.`:w[0];};
const spots=p=>Math.max(p.needed,p.filled.length+1);   // always one blank tag left to take
const tagCount=t=>t.positions.reduce((a,p)=>a+spots(p),0);

async function loadTeams(){
  if(!CONFIG.apiUrl) return structuredClone(SAMPLE.teams);
  const r=await fetch(CONFIG.apiUrl,{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return (await r.json()).teams||[];
}

/* ───────── Tags ───────── */
const SEEN=new Set(), JUST=new Set();   // every "team|position|name" seen so far, and the ones that just arrived
const slotKey=(t,p,n)=>`${t.team}|${p.position}|${n}`;
function rand(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ((h>>>0)%1000)/1000; }
const STRING='<svg class="string" viewBox="0 0 16 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8 0C5 14 4 28 6.5 40M8 0C11 14 12 28 9.5 40" vector-effect="non-scaling-stroke"/></svg>';
function sway(key){
  const r=rand(key), r2=rand(key+'*');
  return `--tilt:${(r*4-2).toFixed(2)}deg;--d:${(-r*8).toFixed(2)}s;--bx:${Math.round(-r*240)}px;--by:${Math.round(-r2*320)}px`;
}

// One tag: a peg, a string, a shadow, and two faces. Front = the position and an empty name line; back = "I'm in!" and the name.
function tagHTML({word,name,key,on,art,tagName='div',attrs=''}){
  const back=name||!art?`<span class="face back shape holed"><b>I’m<br>in!</b><span class="line"><span class="hand${(name||'').length>7?' long':''}">${esc(name||'')}</span></span></span>`
    :`<span class="face pic ${pair(key,art)} back shape holed"><i class="art" style="--img:url(sketches/${art}.webp)"></i></span>`;
  return `<${tagName} class="tag${on?' on':''}${name?'':' blank'}" style="${sway(key)}" ${attrs}><span class="peg"></span><span class="swing">${STRING}
    <span class="shade"><i class="shape"></i></span>
    <span class="flip">
      <span class="face front shape holed"><span class="word${word.length>8?' long':''}">${esc(word)}</span><span class="line"><small>Name</small></span></span>
      ${back}
    </span></span></${tagName}>`;
}

// Sketches (sketches/*.webp, white line art used as a mask so the lines take any brand colour).
// POSITION_SKETCH: the picture on the back of a blank tag (shown when it turns over on the TV).
// TEAM_SKETCHES: the pool for the team's own sketch card and for positions not listed.
const POSITION_SKETCH={parking:'cone',coffee:'coffee',setup:'dolly',teardown:'dolly',vocals:'mic',acoustic:'guitar',electric:'guitar',
  drums:'drums',bass:'speaker',keys:'keys',camera:'camera',sound:'mixer',visuals:'projector',lights:'light',nursery:'kids',
  preschool:'kids',elementary:'bible','check-in':'lanyard',greeter:'wave',info:'chat',usher:'people',cleaning:'cleaning',
  trailer:'roadcase',unloading:'dolly',chairs:'chair',helper:'kidchairs','age 1-2':'kids','age 3-4':'bible',
  'chairs|setup':'chair','chairs|teardown':'chair','production|setup':'cable','logistics|setup':'roadcase'};
const TEAM_SKETCHES={logistics:['dolly','roadcase','cone','tools','ladder','radio','tape','trash'], worship:['stand','drums','mic','keys'],
  production:['headphones','laptop','light','mixer','tape'], chairs:['chair','dolly','ladder'], 'one80 kids':['kids','kidchairs','bible','cleaning'],
  welcome:['sign','coffee','cup','people','wave']};
// The team's own card uses the original drawings (sketches/orig) and hangs somewhere inside the row.
const TEAM_CARD={logistics:['trailer'], worship:['guitar'], production:['camera','headphones'], chairs:['chair'],
  'one80 kids':['highfive'], welcome:['coffee']};
const PAIRS=['c-mist','c-white','c-cream','c-sand','c-blue','c-green'], HANGS=['peg','tape','pin'];
// Drawings that only work as dark lines on a light card
const LIGHT_ONLY=new Set(['chair']), LIGHT_PAIRS=['c-mist','c-white','c-cream','c-sand'];
const pair=(key,art)=>{ const l=LIGHT_ONLY.has(art)?LIGHT_PAIRS:PAIRS; return l[Math.floor(rand(key+'|c')*l.length)]; };
const pool=t=>TEAM_SKETCHES[t.team.toLowerCase()]||['people','wave','coffee'];
function sketchFor(t){ const l=TEAM_CARD[t.team.toLowerCase()]||['highfive']; return l[Math.floor(rand(t.team+'|sketch')*l.length)]; }
function positionSketch(t,p,i){
  const k=p.position.toLowerCase(); const l=pool(t);
  return POSITION_SKETCH[t.team.toLowerCase()+'|'+k]||POSITION_SKETCH[k]||l[Math.floor(rand(`${t.team}|${k}|${i}`)*l.length)];
}
function decoHTML(name,key){
  const k={m:pair(key,name),hang:HANGS[Math.floor(rand(key+'|h')*3)]}, peg=k.hang==='peg';
  return `<div class="tag deco ${k.m}${peg?'':' loose'}" style="${sway(key)};--img:url(sketches/orig/${name}.webp)" aria-hidden="true">${peg?'<span class="peg"></span>':''}<span class="swing">${peg?STRING:''}
    <span class="shade"><i${peg?' class="shape"':''}></i></span><span class="solo${peg?' shape holed':''}"><i class="art"></i></span>
    ${k.hang==='tape'?'<span class="tape"></span>':''}${k.hang==='pin'?'<span class="pushpin"></span>':''}</span></div>`;
}

function tags(t,ti,deco){
  const list=t.positions.flatMap((p,pi)=>Array.from({length:spots(p)},(_,i)=>{
    const n=p.filled[i], key=`${t.team}|${p.position}|${i}`;
    if(n){ const just=JUST.has(slotKey(t,p,n)); return tagHTML({word:p.position,name:n,key,on:!just,attrs:`role="img" aria-label="${esc(p.position)}: ${esc(n)}"${just?' data-just':''}`}); }
    if(TV) return tagHTML({word:p.position,key,art:positionSketch(t,p,i)});
    return tagHTML({word:p.position,key,tagName:'button',attrs:`type="button" data-t="${ti}" data-p="${pi}" aria-label="Join ${esc(t.team)}: ${esc(p.position)}"`});
  }));
  // hang it between two positions inside the row, never first, last, or inside a run of the same position
  if(deco){
    const cuts=[]; let n=0;
    for(const p of t.positions.slice(0,-1)){ n+=spots(p); cuts.push(n); }
    const at=cuts.length?cuts[Math.floor(rand(t.team+'|at')*cuts.length)]:Math.min(1,list.length);
    list.splice(at,0,decoHTML(deco,t.team+'|deco'));
  }
  return `<div class="tags">${list.join('')}</div>`;
}

// Tags that just filled are drawn face up, then turn over one after another.
function turnJust(root){
  if(!JUST.size) return;
  JUST.clear();
  void root.offsetWidth;
  root.querySelectorAll('.tag[data-just]').forEach((el,i)=>setTimeout(()=>{ el.classList.add('on','just'); setTimeout(()=>el.classList.remove('just'),2000); },500+i*400));
}

/* ───────── Phone page ───────── */
function renderPhone(){
  const list=document.getElementById('list');
  if(failed&&!TEAMS.length){ list.innerHTML='<p class="status">Couldn’t load the teams. Check your connection and try again.</p>'; return; }
  list.innerHTML=TEAMS.map((t,ti)=>`<section class="team"><h2 class="serif">${esc(t.team)}</h2>${tags(t,ti,sketchFor(t))}</section>`).join('');
  turnJust(list);
}

document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('button.tag'); if(!b) return;
  const t=TEAMS[b.dataset.t]; openForm(t,t.positions[b.dataset.p]);
});

/* ───────── Sign-up form ───────── */
const dlg=document.getElementById('dlg'), sheet=document.getElementById('sheet');
const touch=matchMedia('(pointer:coarse)').matches;
const ME_KEY='serve:me';   // name, email and phone, remembered in this browser so a second sign-up is one tap
const me=()=>{ try{ return JSON.parse(localStorage.getItem(ME_KEY)||'{}'); }catch{ return {}; } };
function openForm(t,p){
  const m=me();
  sheet.innerHTML=`<div class="sheet-head">
      <div><h2 id="dlgTitle">Sign me up</h2><p class="spot serif">${esc(t.team)} · <em>${esc(p.position)}</em></p></div>
      <button class="x" type="button" aria-label="Close">&times;</button>
    </div>
    <form novalidate>
      <label class="field"><span>Name</span><input name="name" autocomplete="name" required maxlength="80" value="${esc(m.name||'')}"></label>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" inputmode="email" required maxlength="120" value="${esc(m.email||'')}"></label>
      <label class="field"><span>Phone <em>· optional</em></span><input name="phone" type="tel" autocomplete="tel" maxlength="40" value="${esc(m.phone||'')}"></label>
      <label class="field"><span>Notes <em>· optional</em></span><textarea name="notes" maxlength="400"></textarea></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="go" type="submit">I’m in</button>
      <p class="err" role="alert"></p>
    </form>`;
  sheet.querySelector('.x').onclick=closeForm;
  const form=sheet.querySelector('form'), err=sheet.querySelector('.err'), go=sheet.querySelector('.go');
  form.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form));
    for(const k in d) d[k]=d[k].trim();
    if(!d.name){ err.textContent='Add your name.'; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){ err.textContent='Add an email we can reach you at.'; return; }
    err.textContent=''; go.disabled=true; go.textContent='Signing you up…';
    try{
      const res=await signup({action:'signup',team:t.team,position:p.position,...d});
      if(res.ok){ try{ localStorage.setItem(ME_KEY,JSON.stringify({name:d.name,email:d.email,phone:d.phone})); }catch{} done(d,t,p,res); refresh(false); return; }
      err.textContent={already:'You’re already on this one.',missing:'Add your name and email.'}[res.error]||'Something went wrong. Please try again.';
    }catch{ err.textContent='Couldn’t send that. Check your connection and try again.'; }
    go.disabled=false; go.textContent='I’m in';
  };
  dlg.showModal();
  if(!touch&&!m.name) form.elements.name.focus({preventScroll:true});
}
// Their own tag, written in, turning over.
function done(d,t,p,res){
  const first=d.name.split(/\s+/)[0];
  sheet.innerHTML=`<div class="done">
    <div class="stage">${tagHTML({word:p.position,name:short(d.name),key:'me|'+p.position})}</div>
    <h2 class="serif" id="dlgTitle">Welcome to ${esc(t.team)}, ${esc(first)}.</h2>
    <p>${res.receipt===false?'':`We’ve emailed the details to ${esc(d.email)}. `}Someone from the team will be in touch this week.</p>
    <button class="go" type="button">Done</button>
  </div>`;
  sheet.querySelector('.go').onclick=closeForm;
  const tag=sheet.querySelector('.tag'); void tag.offsetWidth;
  setTimeout(()=>tag.classList.add('on','just'),450);
}
function closeForm(){
  if(!dlg.open) return;
  dlg.classList.add('out');
  setTimeout(()=>{ dlg.classList.remove('out'); dlg.close(); },170);
}
dlg.addEventListener('cancel',e=>{ e.preventDefault(); closeForm(); });
dlg.addEventListener('click',e=>{ if(e.target===dlg) closeForm(); });

async function signup(body){
  if(!CONFIG.apiUrl){   // sample mode: the sign-up only lives in this browser
    SAMPLE.teams.find(t=>t.team===body.team).positions.find(x=>x.position===body.position).filled.push(short(body.name));
    return {ok:true,receipt:false};
  }
  const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}

/* ───────── TV ───────── */
// One row per team: as many columns as the busiest team needs, sketch included (7 to 10), so tags shrink before rows wrap.
function renderTV(){
  const root=document.getElementById('tvTeams');
  const cols=Math.min(10,Math.max(7,...TEAMS.map(t=>tagCount(t)+(sketchFor(t)?1:0))));
  root.style.setProperty('--cols',cols);
  root.innerHTML=TEAMS.map(t=>`<section class="team"><h2 class="serif">${esc(t.team)}</h2>${tags(t,0,sketchFor(t))}</section>`).join('');
  fitTV();
  turnJust(root);
}

// Lay out at 1080 wide and fill the screen's height; scale down only if the content runs taller.
function fitTV(){
  const tv=document.getElementById('tv'), rot=document.documentElement.classList.contains('rot');
  const W=rot?innerHeight:innerWidth, H=rot?innerWidth:innerHeight, k0=W/1080;
  tv.style.scale=''; tv.style.minHeight=(H/k0)+'px';
  const k=Math.min(k0,H/tv.offsetHeight);
  tv.style.scale=k.toFixed(4);
  tv.style.marginLeft=((W-1080*k)/2)+'px';
}

/* ───────── Refresh ───────── */
let LAST='';
const CACHE_KEY='serve:teams';
function render(){ TV?renderTV():renderPhone(); }
async function refresh(first){
  try{ TEAMS=await loadTeams(); failed=false; }
  catch{ failed=true; if(TEAMS.length) return; }
  const data=JSON.stringify(TEAMS);
  if(!first&&data===LAST) return;
  for(const t of TEAMS) for(const p of t.positions) for(const n of p.filled){
    const k=slotKey(t,p,n); if(LAST&&!SEEN.has(k)) JUST.add(k); SEEN.add(k);
  }
  LAST=data; render();
  if(!failed&&CONFIG.apiUrl) try{ localStorage.setItem(CACHE_KEY,data); }catch{}
}
// The sheet's server takes 1–2 s to answer: draw the last answer this browser saw straight away, then swap in the fresh one.
try{ const c=CONFIG.apiUrl&&JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if(Array.isArray(c)&&c.length){ TEAMS=c; LAST=JSON.stringify(c); c.forEach(t=>t.positions.forEach(p=>p.filled.forEach(n=>SEEN.add(slotKey(t,p,n))))); render(); } }catch{}
refresh(!LAST);
setInterval(()=>refresh(false),(TV?CONFIG.tvRefreshSeconds:CONFIG.refreshSeconds)*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!TV) refresh(false); });

// Now and then a blank tag turns over to show its picture, then turns back: up to peekMax at once, at random,
// never while a real sign-up is turning over.
let lastPeek=null;
function peekLater(){
  const [a,b]=CONFIG.peekEvery;
  setTimeout(()=>{
    const busy=document.querySelector('#tvTeams .tag.just,#tvTeams .tag[data-just]');
    const blanks=[...document.querySelectorAll('#tvTeams .tag.blank:not(.peek)')].filter(el=>el!==lastPeek);
    if(!busy&&blanks.length&&document.querySelectorAll('#tvTeams .tag.peek').length<CONFIG.peekMax){
      const el=blanks[Math.floor(Math.random()*blanks.length)]; lastPeek=el;
      el.classList.add('peek'); setTimeout(()=>el.classList.remove('peek'),CONFIG.peekHold*1000);
    }
    peekLater();
  },(a+Math.random()*(b-a))*1000);
}

if(TV){
  peekLater();
  addEventListener('resize',fitTV);
  document.fonts&&document.fonts.ready.then(fitTV);
  const sc=document.createElement('script'); sc.src='vendor/qrcode.js';
  sc.onload=()=>{
    const qr=qrcode(0,'M'); qr.addData(CONFIG.joinLink); qr.make();
    const n=qr.getModuleCount(); let d='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
    document.getElementById('qr').innerHTML=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="${d}" fill="#1A376B"/></svg>`;
  };
  document.head.append(sc);
  // keep the screen on, and reload every few hours to pick up any changes to the page
  const awake=()=>{ try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch{} };
  awake(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) awake(); });
  setTimeout(()=>location.reload(),6*3600*1000);
}
</script>
